<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penjumlahan Dua Bilangan</title>
    <link rel="stylesheet" href="style4.css">
</head>

<body>

    <div class="container">
        <h1>Penjumlahan Dua Bilangan</h1>

        <div class="input-group">
            <label for="bilangan1">Bilangan Pertama:</label>
            <input type="number" id="bilangan1" placeholder="Masukkan angka">
        </div>

        <div class="input-group">
            <label for="bilangan2">Bilangan Kedua:</label>
            <input type="number" id="bilangan2" placeholder="Masukkan angka">
        </div>

        <button id="hitung">Hitung</button>

        <p class="hasil">Hasil: <span id="nilai-hasil">0</span></p>
    </div>

    <script src="script4.js"></script>
</body>

</html>
