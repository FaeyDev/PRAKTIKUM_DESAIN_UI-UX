<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation Ticket</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style2.css">
</head>
<body>
    <div class="container">
        <div class="form-wrapper">
            <h1><i class="fas fa-ticket-alt"></i> Form Validation Tiket</h1>

            <form id="bookingForm" novalidate>
                <div class="form-group">
                    <label for="namaPelanggan"><i class="fas fa-user"></i> Nama Pelanggan</label>
                    <input type="text" id="namaPelanggan" name="namaPelanggan" placeholder="Masukkan nama lengkap">
                    <span class="error-message" id="errorNama"></span>
                </div>

                <div class="form-group">
                    <label for="email"><i class="fas fa-envelope"></i> Email</label>
                    <input type="email" id="email" name="email" placeholder="contoh@email.com">
                    <span class="error-message" id="errorEmail"></span>
                </div>

                <div class="form-group">
                    <label for="jamKeberangkatan"><i class="fas fa-clock"></i> Jam Keberangkatan</label>
                    <input type="time" id="jamKeberangkatan" name="jamKeberangkatan">
                    <span class="error-message" id="errorJam"></span>
                </div>

                <div class="form-group">
                    <label for="tujuan"><i class="fas fa-map-marker-alt"></i> Tujuan Keberangkatan</label>
                    <input type="text" id="tujuan" name="tujuan" placeholder="Misal: Jakarta">
                    <span class="error-message" id="errorTujuan"></span>
                </div>

                <div class="form-group">
                    <label for="jumlahTiket"><i class="fas fa-sort-numeric-up"></i> Jumlah Tiket</label>
                    <input type="number" id="jumlahTiket" name="jumlahTiket" placeholder="1 - 10" min="1" max="10">
                    <span class="error-message" id="errorJumlah"></span>
                </div>

                <button type="submit" class="submit-btn">
                    <i class="fas fa-paper-plane"></i> Submit Pemesanan
                </button>
            </form>
        </div>
        <div id="summaryDisplay" class="summary-wrapper">
            <div class="summary-content">
                <i class="fas fa-check-circle success-icon"></i>
                <h2>Pemesanan Berhasil!</h2>
                <p>Terima kasih, data Anda telah kami terima. Berikut adalah rincian pemesanan Anda:</p>
                <div id="summaryDetails"></div>
                <button class="reset-btn" onclick="location.reload();"><i class="fas fa-redo"></i> Buat Pemesanan
                    Baru</button>
            </div>
        </div>
    </div>

    <script src="form-validation.js"></script>
</body>

</html>
