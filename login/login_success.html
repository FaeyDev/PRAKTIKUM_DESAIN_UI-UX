<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Berhasil</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 20px;
        }

        .success-container {
            padding: 50px 40px;
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 450px;
            width: 100%;
            position: relative;
            animation: slideUp 0.6s ease-out;
            transition: transform 0.3s ease;
        }

        .success-container:hover {
            transform: translateY(-5px);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .success-icon {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 25px;
            animation: scaleIn 0.5s ease-out 0.2s both;
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        @keyframes scaleIn {
            from {
                transform: scale(0);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .success-icon i {
            font-size: 40px;
            color: white;
            animation: checkmark 0.5s ease-out 0.4s both;
        }

        @keyframes checkmark {
            from {
                transform: scale(0) rotate(-45deg);
            }

            to {
                transform: scale(1) rotate(0);
            }
        }

        h1 {
            color: #2d3748;
            margin-bottom: 12px;
            font-size: 2.2rem;
            font-weight: 700;
            animation: fadeIn 0.6s ease-out 0.3s both;
        }

        .welcome-text {
            color: #718096;
            font-size: 1.1rem;
            margin-bottom: 35px;
            animation: fadeIn 0.6s ease-out 0.5s both;
        }

        .user-info {
            background-color: #f7fafc;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 30px;
            animation: fadeIn 0.6s ease-out 0.7s both;
        }

        .user-info p {
            color: #4a5568;
            font-size: 0.95rem;
            margin: 5px 0;
        }

        .user-info .label {
            font-weight: 600;
            color: #2d3748;
        }

        .button-container {
            display: flex;
            gap: 15px;
            animation: fadeIn 0.6s ease-out 0.9s both;
        }

        .btn {
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 24px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #4a5568;
        }

        .btn-secondary:hover {
            background: #cbd5e0;
            transform: translateY(-2px);
        }

        .btn i {
            margin-right: 8px;
        }

        @media (max-width: 480px) {
            .success-container {
                padding: 40px 25px;
            }

            h1 {
                font-size: 1.9rem;
            }

            .button-container {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="success-container">
        <div class="success-icon">
            <i class="fas fa-check"></i>
        </div>
        <h1>Login Berhasil</h1>
        <p class="welcome-text">Selamat Datang di Dashboard Manis</p>

        <div class="user-info">
            <p><span class="label">Email:</span> <span id="user-email">user@gmail.com</span></p>
            <p><span class="label">Status:</span> <span style="color: #48bb78;">● Aktif</span></p>
        </div>

        <div class="button-container">
            <button id="logoutBtn" class="btn btn-secondary">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>
    </div>

    <script>
        const username = sessionStorage.getItem('username');
        if (username) {
            document.getElementById('user-email').textContent = username + '@gmail.com';
        }

        const logoutBtn = document.getElementById('logoutBtn');
        logoutBtn.addEventListener('click', function () {
            const confirmLogout = confirm('Apakah kamu ingin keluar manis?');
            if (confirmLogout) {
                sessionStorage.clear();
                window.location.href = 'login.html';
            }
        });

        document.getElementById('dashboardBtn')?.addEventListener('click', (e) => {
            e.preventDefault();
            const btn = e.currentTarget;
            const originalContent = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Memuat...';
            btn.style.pointerEvents = 'none';

            setTimeout(() => {
                btn.innerHTML = originalContent;
                btn.style.pointerEvents = 'auto';

                alert('Mengarahkan ke dashboard...');
            }, 1500);
        });

        document.addEventListener('mousemove', (e) => {
            const container = document.querySelector('.success-container');
            const x = (window.innerWidth - e.pageX) / 100;
            const y = (window.innerHeight - e.pageY) / 100;

            container.style.transform = `translateY(-5px) rotateX(${y}deg) rotateY(${x}deg)`;
        });

        document.addEventListener('mouseleave', () => {
            const container = document.querySelector('.success-container');
            container.style.transform = 'translateY(-5px) rotateX(0) rotateY(0)';
        });
    </script>
</body>

</html>
