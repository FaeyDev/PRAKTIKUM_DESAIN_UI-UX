<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktikum Image Picker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
    <link rel="stylesheet" href="style3.css">
</head>

<body>

    <div class="main-container">
        <div class="image-picker-card">
            <header>
                <h1><i class="fas fa-image"></i>Image Picker</h1>
                <p>Pilih gambar dari dropdown untuk menampilkan informasinya dalam jendela pop-up.</p>
            </header>
            <div class="selector-wrapper">
                <label for="imageSelector">Pilih Gambar:</label>
                <select id="imageSelector">
                </select>
            </div>
        </div>
    </div>
    <div id="alert-overlay" class="alert-overlay">
        <div id="alert-modal" class="alert-modal">
            <span id="modal-close-btn" class="modal-close-btn">&times;</span>
            <div class="modal-content">
                <img id="modal-image"
                    src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="">
                <h3 id="modal-title">Judul Gambar</h3>
                <p id="modal-description">Deskripsi gambar akan muncul di sini.</p>
            </div>
        </div>
    </div>

    <script src="image-picker.js"></script>
</body>

</html>
